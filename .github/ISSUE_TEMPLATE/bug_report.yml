name: Reproducible failure
description: Report a prototype failure with a minimal example.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include command/question, model/version, and synthetic data steps. Do not attach private data or credentials.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized error or run evidence
